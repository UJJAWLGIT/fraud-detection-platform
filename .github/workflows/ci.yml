name: ci

on:
  push:
  pull_request:

jobs:

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn redis aiokafka xgboost \
                      scikit-learn joblib numpy pandas \
                      prometheus-client pydantic pytest httpx

      - name: Run unit tests
        run: |
          cd services/api
          PYTHONPATH=. pytest tests/ -v --tb=short

  sklearn-smoke:
    name: Train sklearn smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ML deps
        run: pip install scikit-learn pandas numpy joblib

      - name: Train sklearn model
        run: |
          cd ml
          python train_sklearn.py \
            --n 5000 \
            --model-out /tmp/smoke_model.joblib \
            --metrics-out /tmp/smoke_metrics.json

      - name: Validate AUC
        run: |
          python -c "
          import json, sys
          m = json.load(open('/tmp/smoke_metrics.json'))
          print('AUC:', m['auc'])
          sys.exit(0 if m['auc'] > 0.5 else 1)
          "

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t fraud-api . -f services/api/Dockerfile
